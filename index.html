<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c4cff">
  <title>বাংলা ছড়া ও গল্প</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 বাংলা ছড়া ও গল্প</div>
    <button id="themeBtn" class="icon-btn" aria-label="থিম বদলান">🌙</button>
  </header>

  <main>
    <section class="hero">
      <span class="badge">✨ শিশুদের জন্য মজার পাঠ</span>
      <h1>ছড়া পড়ুন, গল্প শুনুন,<br><span>আনন্দে শিখুন</span></h1>
      <p>সহজ বাংলা ছড়া ও ছোট গল্প—মোবাইলেই সুন্দরভাবে পড়ুন এবং শুনুন।</p>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="ছড়া বা গল্প খুঁজুন...">
        <span>🔎</span>
      </div>
    </section>

    <section class="section-head">
      <div><h2>আজকের সংগ্রহ</h2><p id="count">কিছু সুন্দর লেখা আপনার জন্য</p></div>
    </section>
    <section id="cards" class="cards"></section>

    <section class="reader" id="reader">
      <button id="closeReader" class="close">✕</button>
      <div class="reader-icon">📖</div>
      <div><span id="readerType" class="type">ছড়া</span><h2 id="readerTitle"></h2></div>
      <p id="readerText"></p>
      <div class="actions">
        <button id="speakBtn" class="primary">🔊 পড়ে শোনাও</button>
        <button id="stopBtn" class="secondary">⏹ বন্ধ</button>
        <button id="favBtn" class="secondary">♡ পছন্দ</button>
      </div>
    </section>
  </main>

  <footer>© 2026 বাংলা ছড়া ও গল্প • তৈরি করা হয়েছে ভালোবাসা দিয়ে ❤️</footer>
  <script src="script.js"></script>
</body>
</html>
